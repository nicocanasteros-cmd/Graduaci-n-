<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Aviso">
    <link rel="manifest" href="data:application/json;charset=utf-8,{%22name%22:%22Aviso%22,%22short_name%22:%22Aviso%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23000000%22,%22theme_color%22:%22%23000000%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20fill='%23000'/%3E%3Ctext%20x='50'%20y='60'%20font-size='40'%20text-anchor='middle'%20fill='%23ff0000'%3EM%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22100x100%22,%22type%22:%22image/svg+xml%22}]}">
    <title>Aviso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .mensaje {
            color: #ffffff;
            font-size: clamp(18px, 5vw, 34px);
            font-weight: bold;
            line-height: 1.45;
            max-width: 95%;
            word-wrap: break-word;
        }
        
        .dias {
            display: block;
            font-size: 1.25em;
            margin-bottom: 10px;
        }
        
        .fecha {
            display: block;
            font-size: 0.9em;
            color: #cccccc;
            margin-bottom: 22px;
            font-weight: normal;
        }
        
        .numero-rojo {
            color: #ff0000;
            font-size: 1.3em;
        }
        
        .numero-cero {
            color: #ff0000;
            font-size: 1.8em;
            font-weight: 900;
        }
        
        .abril-rojo {
            color: #ff0000;
            font-size: 1.6em;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .mala-paga {
            color: #ff0000;
            font-size: clamp(90px, 32vw, 200px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0px;
            line-height: 0.85;
            margin-top: 18px;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            display: block;
        }
        
        .botones {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
        }
        
        .texto-notif {
            color: #aaaaaa;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }
        
        .btn.secundario {
            background: #333;
            font-size: 13px;
        }
        
        .btn:active {
            opacity: 0.8;
        }
        
        .estado {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mensaje" id="texto">
            <!-- Se genera con JavaScript -->
        </div>
        
        <div class="botones" id="botones">
            <div class="texto-notif" id="textoNotif">🎓 activa las notificaciones para saber cuántos días quedan 🎓</div>
            <button class="btn" id="btnNotif" onclick="activarNotificaciones()">Activar recordatorios</button>
            <button class="btn secundario" id="btnInstalar" onclick="instalarApp()" style="display:none;">Instalar como aplicación</button>
            <div class="estado" id="estado"></div>
        </div>
    </div>

    <script>
        // Fecha de graduación (solo para el mensaje de hoy)
        const fechaGraduacion = new Date(2026, 11, 2); // 2 de diciembre 2026
        
        // Fecha límite de la deuda: domingo 11 de octubre de 2026
        const fechaLimite = new Date(2026, 9, 11);
        
        // Mañana (jueves 8) es cuando empieza la deuda
        const fechaInicioDeuda = new Date(2026, 9, 8); // 8 de octubre 2026
        
        const diasSemana = [
            'domingo', 'lunes', 'martes', 'miércoles', 
            'jueves', 'viernes', 'sábado'
        ];
        
        let deferredPrompt = null;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btnInstalar').style.display = 'block';
        });
        
        function esHoyMiercoles() {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const limite = new Date(fechaInicioDeuda);
            limite.setHours(0, 0, 0, 0);
            return hoy < limite; // Antes del jueves 8 = mostrar graduación
        }
        
        function calcularDiasGraduacion() {
            // Fijo: desde el 7 de octubre hasta el 2 de diciembre = 56 días
            return 56;
        }
        
        function calcularDiasRestantes() {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            fechaLimite.setHours(0, 0, 0, 0);
            
            const diferencia = fechaLimite - hoy;
            return Math.ceil(diferencia / (1000 * 60 * 60 * 24));
        }
        
        function obtenerFechaActual() {
            const hoy = new Date();
            const diaNombre = diasSemana[hoy.getDay()];
            const numero = hoy.getDate();
            return `${diaNombre} ${numero}`;
        }
        
        function actualizarMensaje() {
            const contenedor = document.getElementById('texto');
            const textoNotif = document.getElementById('textoNotif');
            const fechaHoy = obtenerFechaActual();
            
            if (esHoyMiercoles()) {
                // HOY (miércoles): mensaje de graduación estático
                const diasGrad = calcularDiasGraduacion();
                contenedor.innerHTML = `
                    <span class="dias">Días restantes para la graduación 🎓</span>
                    <span class="dias" style="margin-top:12px;">Quedan <span class="numero-rojo">${diasGrad}</span> días</span>
                    <span class="fecha">${fechaHoy}</span>
                `;
                // Mostrar el texto pequeño de notificaciones
                textoNotif.style.display = 'block';
            } 
            else {
                // DESDE MAÑANA (jueves) en adelante: mensaje de deuda
                const dias = calcularDiasRestantes();
                
                // Ocultar el texto de graduación
                textoNotif.style.display = 'none';
                
                if (dias > 1) {
                    contenedor.innerHTML = `
                        <span class="dias">Quedan <span class="numero-rojo">${dias}</span> días</span>
                        <span class="fecha">${fechaHoy}</span>
                        para pagar su deuda de 23.000 a Nicolás<br>
                        que debe desde abril
                    `;
                } 
                else if (dias === 1) {
                    contenedor.innerHTML = `
                        <span class="dias">Queda <span class="numero-rojo">1</span> día</span>
                        <span class="fecha">${fechaHoy}</span>
                        para pagar su deuda de 23.000 a Nicolás<br>
                        que debe desde abril
                    `;
                } 
                else {
                    // Domingo y posteriores (0, -1, -2...)
                    contenedor.innerHTML = `
                        <span class="dias">Quedan <span class="numero-cero">${dias}</span> días</span>
                        <span class="fecha">${fechaHoy}</span>
                        Pague la plata lo más pronto posible<br>
                        que debe desde <span class="abril-rojo">abril</span>
                        <span class="mala-paga">MALA<br>PAGA</span>
                    `;
                }
            }
        }
        
        async function activarNotificaciones() {
            const estado = document.getElementById('estado');
            const btn = document.getElementById('btnNotif');
            
            if (!('Notification' in window)) {
                estado.textContent = 'Tu navegador no soporta notificaciones';
                return;
            }
            
            if (Notification.permission === 'granted') {
                mostrarNotificacion();
                estado.textContent = 'Notificaciones activadas';
                btn.textContent = 'Recordatorio enviado';
                return;
            }
            
            if (Notification.permission === 'denied') {
                estado.textContent = 'Permiso denegado. Actívalo en ajustes del navegador.';
                return;
            }
            
            const permiso = await Notification.requestPermission();
            
            if (permiso === 'granted') {
                mostrarNotificacion();
                estado.textContent = '¡Notificaciones activadas!';
                btn.textContent = 'Recordatorio enviado';
            } else {
                estado.textContent = 'No se activaron las notificaciones';
            }
        }
        
        function mostrarNotificacion() {
            let cuerpo;
            
            if (esHoyMiercoles()) {
                cuerpo = `Quedan 56 días para la graduación 🎓`;
            } else {
                const dias = calcularDiasRestantes();
                if (dias > 1) {
                    cuerpo = `Quedan ${dias} días para pagar la deuda de 23.000`;
                } else if (dias === 1) {
                    cuerpo = `Queda 1 día para pagar la deuda de 23.000`;
                } else {
                    cuerpo = `Quedan ${dias} días. El plazo ya venció. MALA PAGA`;
                }
            }
            
            new Notification('Aviso', {
                body: cuerpo,
                icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext x='50' y='62' font-size='45' text-anchor='middle' fill='%23ff0000'%3E!%3C/text%3E%3C/svg%3E",
                requireInteraction: true
            });
        }
        
        async function instalarApp() {
            if (!deferredPrompt) {
                document.getElementById('estado').textContent = 'Usa el menú del navegador → "Añadir a pantalla de inicio"';
                return;
            }
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                document.getElementById('estado').textContent = '¡Aplicación instalada!';
                document.getElementById('btnInstalar').style.display = 'none';
            }
            deferredPrompt = null;
        }
        
        // Actualizar al cargar
        actualizarMensaje();
        
        if ('Notification' in window && Notification.permission === 'granted') {
            document.getElementById('btnNotif').textContent = 'Enviar recordatorio ahora';
            document.getElementById('estado').textContent = 'Notificaciones ya activadas';
        }
    </script>
</body>
              </html>
